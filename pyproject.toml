[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "low-prior-wind"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "numpy>=2,<3", "pandas>=2.2,<3", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools]
packages = ["wind_backend", "wind_agent", "wind_contracts", "windagent"]
package-dir = {wind_backend = "backend/wind_backend", wind_agent = "agent/wind_agent", wind_contracts = "contracts/wind_contracts", windagent = "windagent"}

[tool.pytest.ini_options]
pythonpath = [".", "backend", "agent", "contracts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
